<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archives des Stands - JoJo Codex</title>
  
  <!-- Liens vers les feuilles de style selon ta structure modulaire -->
  <link rel="stylesheet" href="css/pages/_stands.css">
</head>
<body>

  <!-- Navigation vers les autres fichiers de la racine -->
  <nav class="codex-nav">
    <a href="index.html" class="nav-link">← Accueil</a>
    <a href="parts.html" class="nav-link">Parties</a>
    <a href="characters.html" class="nav-link">Personnages</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </nav>

  <main>
    <!-- Section Stands / Héros -->
    <section id="stands-section" class="jojo-section">
      <header class="section-header">
        <img src="assets/images/ui/logo-diego-brando.jpg" alt="Emblème Diego Brando" class="section-logo" />
        <h2>Archives des Stands & Héros</h2>
      </header>
      
      <div class="heroes-grid">
        <!-- Fiche Jotaro -->
        <article class="hero-card">
          <div class="card-image">
            <img src="assets/images/heroes/jotaro.webp" alt="Jotaro Kujo" />
          </div>
          <div class="card-content">
            <h3>Jotaro Kujo</h3>
            <p class="stand-name">Stand : Star Platinum</p>
          </div>
        </article>

        <!-- Fiche Joseph -->
        <article class="hero-card">
          <div class="card-image">
            <img src="assets/images/heroes/joseph.webp" alt="Joseph Joestar" />
          </div>
          <div class="card-content">
            <h3>Joseph Joestar</h3>
            <p class="stand-name">Stand : Hermit Purple</p>
          </div>
        </article>

        <!-- Fiche Jonathan -->
        <article class="hero-card">
          <div class="card-image">
            <img src="assets/images/heroes/jonathan-jo.webp" alt="Jonathan Joestar" />
          </div>
          <div class="card-content">
            <h3>Jonathan Joestar</h3>
            <p class="stand-name">Maître de l'Onde</p>
          </div>
        </article>

        <!-- Fiche Caesar -->
        <article class="hero-card">
          <div class="card-image">
            <img src="assets/images/heroes/caesar.webp" alt="Caesar Zeppeli" />
          </div>
          <div class="card-content">
            <h3>Caesar Zeppeli</h3>
            <p class="stand-name">Utilisateur de l'Onde</p>
          </div>
        </article>

        <!-- Fiche Speedwagon -->
        <article class="hero-card">
          <div class="card-image">
            <img src="assets/images/heroes/speedwagon.webp" alt="Speedwagon" />
          </div>
          <div class="card-content">
            <h3>R.E.O. Speedwagon</h3>
            <p class="stand-name">Allié de la lignée Joestar</p>
          </div>
        </article>
      </div>
    </section>
  </main>

</body>
</html>
